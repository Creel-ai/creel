name: Build Executor Images

on:
  push:
    branches: [main]
    paths:
      - "src/executors/**"
  release:
    types: [published]
  schedule:
    # Weekly rebuild for security patches (Sunday 03:00 UTC)
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/executor

jobs:
  # Detect which executors changed (push to main only)
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      executors: ${{ steps.changed.outputs.executors }}
      build_all: ${{ steps.changed.outputs.build_all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed executors
        id: changed
        run: |
          # Build all on release, schedule, or workflow_dispatch
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "build_all=true" >> "$GITHUB_OUTPUT"
            echo "executors=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "build_all=false" >> "$GITHUB_OUTPUT"

          # Find changed executor directories
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- src/executors/ \
            | sed -n 's|^src/executors/\([^/]*\)/.*|\1|p' \
            | grep -v '\.py$' \
            | sort -u)

          # If base image changed, rebuild all
          if echo "$CHANGED" | grep -q '^base$'; then
            echo "build_all=true" >> "$GITHUB_OUTPUT"
            echo "executors=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If shared files changed (e.g. google_creds.py), rebuild all
          SHARED_CHANGED=$(git diff --name-only HEAD~1 HEAD -- src/executors/ \
            | grep -E '^src/executors/[^/]+\.py$' || true)
          if [[ -n "$SHARED_CHANGED" ]]; then
            echo "build_all=true" >> "$GITHUB_OUTPUT"
            echo "executors=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build JSON array of changed executors
          JSON="["
          FIRST=true
          for name in $CHANGED; do
            if [[ -d "src/executors/$name" && -f "src/executors/$name/Dockerfile" ]]; then
              if [[ "$FIRST" == "true" ]]; then
                FIRST=false
              else
                JSON+=","
              fi
              JSON+="\"$name\""
            fi
          done
          JSON+="]"
          echo "executors=$JSON" >> "$GITHUB_OUTPUT"

  # List all executor directories for matrix
  list-executors:
    runs-on: ubuntu-latest
    outputs:
      executors: ${{ steps.list.outputs.executors }}
    steps:
      - uses: actions/checkout@v4

      - name: List executor directories
        id: list
        run: |
          JSON="["
          FIRST=true
          for dir in src/executors/*/; do
            name=$(basename "$dir")
            # Skip base (built separately) and non-executor dirs
            if [[ "$name" == "base" || "$name" == "__pycache__" ]]; then
              continue
            fi
            if [[ ! -f "$dir/Dockerfile" ]]; then
              continue
            fi
            if [[ "$FIRST" == "true" ]]; then
              FIRST=false
            else
              JSON+=","
            fi
            JSON+="\"$name\""
          done
          JSON+="]"
          echo "executors=$JSON" >> "$GITHUB_OUTPUT"

  # Build the shared base image first
  build-base:
    needs: [detect-changes, list-executors]
    if: |
      needs.detect-changes.outputs.build_all == 'true' ||
      needs.detect-changes.outputs.executors != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase IMAGE_PREFIX for GHCR
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: src/executors/base
          file: src/executors/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-base:latest
            ${{ env.IMAGE_PREFIX }}-base:${{ github.sha }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  # Build each executor image (local only), scan, then push
  build-scan-push:
    needs: [detect-changes, list-executors, build-base]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        executor: ${{ fromJson(
          needs.detect-changes.outputs.build_all == 'true'
            && needs.list-executors.outputs.executors
            || needs.detect-changes.outputs.executors
          ) }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase IMAGE_PREFIX for GHCR
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: meta
        run: |
          # Convert underscores to hyphens for image name
          IMAGE_NAME=$(echo "${{ matrix.executor }}" | tr '_' '-')
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Patch Dockerfile FROM to use GHCR base
        run: |
          DOCKERFILE="src/executors/${{ matrix.executor }}/Dockerfile"
          if ! grep -q 'FROM creel-executor-base:latest' "$DOCKERFILE"; then
            echo "::warning::Dockerfile does not contain expected FROM line"
          fi
          sed -i "s|FROM creel-executor-base:latest|FROM ${{ env.IMAGE_PREFIX }}-base:latest|" \
            "$DOCKERFILE"

      - name: Determine tags
        id: tags
        run: |
          IMAGE="${{ env.IMAGE_PREFIX }}-${{ steps.meta.outputs.image_name }}"
          TAGS="${IMAGE}:latest,${IMAGE}:${{ github.sha }}"

          # Add semver tag on release
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"  # strip leading v
            TAGS+=",${IMAGE}:${VERSION}"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      # Build locally first (no push) for scanning
      - name: Build executor image (local)
        uses: docker/build-push-action@v6
        with:
          context: src/executors
          file: src/executors/${{ matrix.executor }}/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_PREFIX }}-${{ steps.meta.outputs.image_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.executor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.executor }}

      # Scan before push — fail on CRITICAL/HIGH vulnerabilities
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "${{ env.IMAGE_PREFIX }}-${{ steps.meta.outputs.image_name }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      # Push only after scan passes
      - name: Push executor image
        uses: docker/build-push-action@v6
        with:
          context: src/executors
          file: src/executors/${{ matrix.executor }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.executor }}
