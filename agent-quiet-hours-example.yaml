# Example agent.yaml with quiet hours configuration

system_prompt: "You are a helpful assistant."

llm:
  model: "claude-sonnet-4-20250514"
  max_tokens: 300

# Quiet hours configuration
quiet_hours:
  enabled: true
  start: "23:00"                  # 24-hour format
  end: "08:00"                    # Overnight range supported
  timezone: "America/Denver"      # Timezone for quiet hours
  allow_urgent: true              # Allow urgent messages during quiet hours

channels:
  imessage:
    listen_to: "+15551234567"
    poll_interval: 3

agent:
  max_turns: 10

session:
  sessions_dir: "sessions"
  max_history: 50
  ttl_hours: 0

workspace:
  path: "workspace"
  timezone: "America/Denver"

tools: {}