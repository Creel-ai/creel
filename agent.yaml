system_prompt: |
  You are a personal assistant. Be concise and helpful.
  Today is {date}.

tools:
  check_calendar:
    executor: calendar
    secrets: secrets/gcal.env.enc
    description: "Check today's calendar events"
    parameters:
      range:
        type: string
        description: "Time range: 'today' or 'week'"

  create_event:
    executor: gcal_write
    secrets: secrets/gcal_write.env.enc
    description: "Create a calendar event"
    parameters:
      summary:
        type: string
        description: "Event title"
        required: true
      start:
        type: string
        description: "Start time (ISO 8601)"
        required: true
      end:
        type: string
        description: "End time (ISO 8601)"
        required: true
      description:
        type: string
        description: "Event description"
      location:
        type: string
        description: "Event location"

  check_email:
    executor: gmail_readonly
    secrets: secrets/gmail.env.enc
    description: "Search Gmail for emails"
    parameters:
      query:
        type: string
        description: "Gmail search query (e.g., 'is:unread newer_than:1d')"
        required: true
      max_results:
        type: string
        description: "Max emails to return (default: 20)"

  read_email:
    executor: gmail_readonly
    secrets: secrets/gmail.env.enc
    description: "Read the full content of a specific email by its ID"
    parameters:
      message_id:
        type: string
        description: "Gmail message ID (from check_email results)"
        required: true

  send_email:
    executor: gmail_send
    secrets: secrets/gmail_send.env.enc
    description: "Send an email"
    parameters:
      to:
        type: string
        description: "Recipient email"
        required: true
      subject:
        type: string
        description: "Subject line"
        required: true
      body:
        type: string
        description: "Email body"
        required: true

  trash_email:
    executor: gmail_modify
    secrets: secrets/gmail_modify.env.enc
    description: "Move an email to trash. Always include the subject."
    parameters:
      message_id:
        type: string
        description: "Gmail message ID"
        required: true
      subject:
        type: string
        description: "Email subject line (for confirmation display)"
        required: true
    fixed_args:
      action: "trash"

  mark_read:
    executor: gmail_modify
    secrets: secrets/gmail_modify.env.enc
    description: "Mark an email as read"
    parameters:
      message_id:
        type: string
        description: "Gmail message ID"
        required: true
    fixed_args:
      action: "modify"
      remove_labels: "UNREAD"

  check_weather:
    executor: weather
    description: "Get current weather and forecast"
    parameters:
      location:
        type: string
        description: "City name or coordinates"
        required: true

  check_drive:
    executor: drive
    secrets: secrets/drive.env.enc
    description: "Search Google Drive files"
    parameters:
      query:
        type: string
        description: "Drive search query"
      max_results:
        type: string
        description: "Max files to return"

  upload_file:
    executor: drive_write
    secrets: secrets/drive_write.env.enc
    description: "Upload a file to Google Drive"
    parameters:
      name:
        type: string
        description: "File name"
        required: true
      content:
        type: string
        description: "File content"
        required: true
      mime_type:
        type: string
        description: "MIME type (default: text/plain)"

  check_messages:
    executor: bluebubbles
    secrets: secrets/bluebubbles.env.enc
    description: "Check recent iMessages"
    parameters:
      chat_id:
        type: string
        description: "Specific chat to check (optional)"
      limit:
        type: string
        description: "Number of messages (max 50)"

  send_imessage:
    executor: bluebubbles_send
    secrets: secrets/bluebubbles.env.enc
    description: "Send an iMessage"
    parameters:
      chat_id:
        type: string
        description: "Chat to send to"
        required: true
      text:
        type: string
        description: "Message text (max 2000 chars)"
        required: true

  react_imessage:
    executor: bluebubbles_react
    secrets: secrets/bluebubbles.env.enc
    description: "React to an iMessage with a tapback"
    parameters:
      chat_id:
        type: string
        description: "Chat ID"
        required: true
      message_guid:
        type: string
        description: "Message GUID to react to"
        required: true
      reaction:
        type: string
        description: "Reaction type (love, like, dislike, laugh, emphasis, question)"
        required: true

  get_chats:
    executor: bluebubbles_chats
    secrets: secrets/bluebubbles.env.enc
    description: "List recent iMessage chats"
    parameters:
      limit:
        type: string
        description: "Number of chats to return (max 50)"

  # Apple Notes
  list_notes:
    executor: apple_notes
    description: "List notes from Apple Notes"
    parameters:
      folder:
        type: string
        description: "Notes folder (default: Notes)"
    fixed_args:
      action: "list_notes"

  search_notes:
    executor: apple_notes
    description: "Search Apple Notes by text content"
    parameters:
      query:
        type: string
        description: "Search query"
        required: true
    fixed_args:
      action: "search_notes"

  read_note:
    executor: apple_notes
    description: "Read the full content of a note by title"
    parameters:
      name:
        type: string
        description: "Note title"
        required: true
    fixed_args:
      action: "read_note"

  create_note:
    executor: apple_notes
    description: "Create a new note in Apple Notes"
    parameters:
      title:
        type: string
        description: "Note title"
        required: true
      body:
        type: string
        description: "Note content"
        required: true
      folder:
        type: string
        description: "Target folder (default: Notes)"
    fixed_args:
      action: "create_note"

  # Apple Reminders
  list_reminders:
    executor: apple_reminders
    description: "List reminders from Apple Reminders"
    parameters:
      list_name:
        type: string
        description: "Reminder list name (default: Reminders)"
    fixed_args:
      action: "list_reminders"

  create_reminder:
    executor: apple_reminders
    description: "Create a new reminder"
    parameters:
      title:
        type: string
        description: "Reminder title"
        required: true
      due_date:
        type: string
        description: "Due date (ISO 8601, e.g. 2024-03-15T09:00:00)"
      notes:
        type: string
        description: "Additional notes"
      list_name:
        type: string
        description: "Reminder list (default: Reminders)"
    fixed_args:
      action: "create_reminder"

  complete_reminder:
    executor: apple_reminders
    description: "Mark a reminder as completed"
    parameters:
      name:
        type: string
        description: "Reminder title"
        required: true
      list_name:
        type: string
        description: "Reminder list (default: Reminders)"
    fixed_args:
      action: "complete_reminder"

  get_reminder_lists:
    executor: apple_reminders
    description: "List available reminder lists"
    parameters: {}
    fixed_args:
      action: "get_lists"

  # Web Search
  web_search:
    executor: brave_search
    secrets: secrets/brave.env.enc
    description: "Search the web using Brave Search"
    parameters:
      query:
        type: string
        description: "Search query"
        required: true
      count:
        type: string
        description: "Number of results (default: 5, max: 20)"

  fetch_url:
    executor: fetch_url
    description: "Fetch and extract text content from a URL"
    parameters:
      url:
        type: string
        description: "URL to fetch"
        required: true
      max_chars:
        type: string
        description: "Max characters to return (default: 10000)"

  # Shell exec
  exec:
    executor: exec
    description: "Run shell commands in a sandboxed environment"
    image: creel-exec:minimal
    parameters:
      command:
        type: string
        description: "Shell command to execute"
        required: true
      workdir:
        type: string
        description: "Working directory (must be within a mounted path)"
    mounts:
      - path: ~/.creel/workspace
        mode: rw
    network: false

  # Things 3 (via bridge)
  list_things:
    executor: things
    description: "List tasks from Things 3"
    parameters:
      filter:
        type: string
        description: "Task filter: inbox, today, anytime, upcoming, someday, logbook"
    fixed_args:
      action: "list"

  create_things_task:
    executor: things
    description: "Create a new task in Things 3"
    parameters:
      title:
        type: string
        description: "Task title"
        required: true
      notes:
        type: string
        description: "Task notes/description"
      when:
        type: string
        description: "Schedule: today, evening, tomorrow, or specific date"
      deadline:
        type: string
        description: "Deadline date (YYYY-MM-DD format)"
      tags:
        type: string
        description: "Comma-separated tag names"
      list:
        type: string
        description: "Area or project name"
    fixed_args:
      action: "create"

  complete_things_task:
    executor: things
    description: "Mark a Things 3 task as completed"
    parameters:
      title:
        type: string
        description: "Task title to complete"
        required: true
    fixed_args:
      action: "complete"

  # iMessage Bridge (for broader iMessage access)
  imessage_send:
    executor: imessage_bridge
    description: "Send iMessage via bridge (broader recipient support)"
    parameters:
      recipient:
        type: string
        description: "Phone number or email address"
        required: true
      text:
        type: string
        description: "Message text"
        required: true
    fixed_args:
      action: "send"

llm:
  model: claude-sonnet-4-20250514
  max_tokens: 1024
  secrets: secrets/anthropic.env.enc

agent:
  max_turns: 15

session:
  sessions_dir: sessions
  max_history: 50
  summarize_on_trim: true

bridge:
  enabled: true
  url: "http://localhost:8766"
  token: "$BRIDGE_TOKEN"

workspace:
  path: workspace
  timezone: "America/Denver"
  memory_days: 2
  memory_max_chars: 5000
  max_chars_per_file: 20000
  compact_after_days: 7
  max_daily_entries: 50
  max_long_term_lines: 200

channels:
  imessage:
    listen_to: "$PHONE"
    poll_interval: 3
  bluebubbles:
    server_url: "$BLUEBUBBLES_URL"
    password: "$BLUEBUBBLES_PASSWORD"
    listen_to:
      - "$PHONE"
    poll_interval: 3

guardian:
  enabled: true
  debug: true
  review:
    timeout_seconds: 60
    default_on_timeout: deny
  fast_classifier:
    enabled: true
    threshold: 0.95
    model_name: protectai/deberta-v3-base-prompt-injection-v2
  llm_judge:
    enabled: false
  policy:
    enabled: true
    policy_file: policies/default.yaml
  coherence:
    enabled: true  # LLM-based check that tool calls match user intent
    model: claude-haiku-4-5-20251001
    max_tokens: 256
  audit:
    enabled: true
    log_file: guardian_audit.jsonl
