system_prompt: |
  You are a personal assistant. Be concise and helpful.
  Today is {date}.

tools:
  check_calendar:
    executor: calendar
    secrets: secrets/gcal.env.enc
    description: "Check today's calendar events"
    parameters:
      range:
        type: string
        description: "Time range: 'today' or 'week'"

  create_event:
    executor: gcal_write
    secrets: secrets/gcal_write.env.enc
    description: "Create a calendar event"
    parameters:
      summary:
        type: string
        description: "Event title"
        required: true
      start:
        type: string
        description: "Start time (ISO 8601)"
        required: true
      end:
        type: string
        description: "End time (ISO 8601)"
        required: true
      description:
        type: string
        description: "Event description"
      location:
        type: string
        description: "Event location"

  check_email:
    executor: gmail_readonly
    secrets: secrets/gmail.env.enc
    description: "Search Gmail for emails"
    parameters:
      query:
        type: string
        description: "Gmail search query (e.g., 'is:unread newer_than:1d')"
        required: true
      max_results:
        type: string
        description: "Max emails to return (default: 20)"

  read_email:
    executor: gmail_readonly
    secrets: secrets/gmail.env.enc
    description: "Read the full content of a specific email by its ID"
    parameters:
      message_id:
        type: string
        description: "Gmail message ID (from check_email results)"
        required: true

  send_email:
    executor: gmail_send
    secrets: secrets/gmail_send.env.enc
    description: "Send an email"
    parameters:
      to:
        type: string
        description: "Recipient email"
        required: true
      subject:
        type: string
        description: "Subject line"
        required: true
      body:
        type: string
        description: "Email body"
        required: true

  trash_email:
    executor: gmail_modify
    secrets: secrets/gmail_modify.env.enc
    description: "Move an email to trash. Always include the subject."
    parameters:
      message_id:
        type: string
        description: "Gmail message ID"
        required: true
      subject:
        type: string
        description: "Email subject line (for confirmation display)"
        required: true
    fixed_args:
      action: "trash"

  mark_read:
    executor: gmail_modify
    secrets: secrets/gmail_modify.env.enc
    description: "Mark an email as read"
    parameters:
      message_id:
        type: string
        description: "Gmail message ID"
        required: true
    fixed_args:
      action: "modify"
      remove_labels: "UNREAD"

  check_weather:
    executor: weather
    description: "Get current weather and forecast"
    parameters:
      location:
        type: string
        description: "City name or coordinates"
        required: true

  check_drive:
    executor: drive
    secrets: secrets/drive.env.enc
    description: "Search Google Drive files"
    parameters:
      query:
        type: string
        description: "Drive search query"
      max_results:
        type: string
        description: "Max files to return"

  upload_file:
    executor: drive_write
    secrets: secrets/drive_write.env.enc
    description: "Upload a file to Google Drive"
    parameters:
      name:
        type: string
        description: "File name"
        required: true
      content:
        type: string
        description: "File content"
        required: true
      mime_type:
        type: string
        description: "MIME type (default: text/plain)"

  check_messages:
    executor: bluebubbles
    secrets: secrets/bluebubbles.env.enc
    description: "Check recent iMessages"
    parameters:
      chat_id:
        type: string
        description: "Specific chat to check (optional)"
      limit:
        type: string
        description: "Number of messages (max 50)"

  send_imessage:
    executor: bluebubbles_send
    secrets: secrets/bluebubbles.env.enc
    description: "Send an iMessage"
    parameters:
      chat_id:
        type: string
        description: "Chat to send to"
        required: true
      text:
        type: string
        description: "Message text (max 2000 chars)"
        required: true

  react_imessage:
    executor: bluebubbles_react
    secrets: secrets/bluebubbles.env.enc
    description: "React to an iMessage with a tapback"
    parameters:
      chat_id:
        type: string
        description: "Chat ID"
        required: true
      message_guid:
        type: string
        description: "Message GUID to react to"
        required: true
      reaction:
        type: string
        description: "Reaction type (love, like, dislike, laugh, emphasis, question)"
        required: true

  get_chats:
    executor: bluebubbles_chats
    secrets: secrets/bluebubbles.env.enc
    description: "List recent iMessage chats"
    parameters:
      limit:
        type: string
        description: "Number of chats to return (max 50)"

llm:
  model: claude-sonnet-4-20250514
  max_tokens: 1024
  secrets: secrets/anthropic.env.enc

agent:
  max_turns: 15

session:
  sessions_dir: sessions
  max_history: 50
  summarize_on_trim: true

workspace:
  path: workspace
  timezone: "America/Denver"
  memory_days: 2
  memory_max_chars: 5000
  max_chars_per_file: 20000

channels:
  imessage:
    listen_to: "$PHONE"
    poll_interval: 3
  bluebubbles:
    server_url: "$BLUEBUBBLES_URL"
    password: "$BLUEBUBBLES_PASSWORD"
    listen_to:
      - "$PHONE"
    poll_interval: 3

guardian:
  enabled: true
  debug: true
  review:
    timeout_seconds: 60
    default_on_timeout: deny
  fast_classifier:
    enabled: true
    threshold: 0.95
    model_name: protectai/deberta-v3-base-prompt-injection-v2
  llm_judge:
    enabled: false
  policy:
    enabled: true
    policy_file: policies/default.yaml
  audit:
    enabled: true
    log_file: guardian_audit.jsonl
