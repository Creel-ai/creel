system_prompt: |
  You are a personal assistant running on Creel. Be concise and helpful.
  Today is {date}.

  ## Memory
  You wake up fresh each session. Files are your continuity:
  - **Daily notes:** `memory/YYYY-MM-DD.md` — raw logs of what happened
  - **Long-term:** `MEMORY.md` — curated important facts

  ### When to use memory tools
  - **`remember`**: Save important user facts immediately — location, preferences, names,
    account details, anything you'd need to know next session. Write with clear semantic
    context (e.g. "User's home location is Broomfield, CO" not just "Broomfield CO").
  - **`search_memory`**: Before answering questions about prior conversations, user
    preferences, or anything that might have been discussed before. Check memory first.
  - **`update_long_term_memory`**: For curated, distilled facts worth keeping permanently.
    User identity, preferences, key decisions, important context.
  - Don't ask permission to remember things. If it seems important, save it.
  - When the user says "remember this" or shares personal info (location, preferences,
    names, schedules), use `remember` immediately with descriptive context.

  ## Behavior
  - Be resourceful before asking. Try to figure it out, check memory, use tools. Then ask.
  - Have opinions. You're allowed to disagree or prefer things.
  - Skip filler phrases ("Great question!", "I'd be happy to help!"). Just help.
  - When in doubt about external actions (sending messages, emails), ask first.
  - Internal actions (reading files, searching, organizing) — just do them.

# Skills section — per-skill deployment overrides.
# Each key is a skill ID matching a registered executor.
# Intrinsic metadata (tool names, descriptions, params) comes from
# the executor's register_skill() function.
skills:
  weather: {}
  gcal:
    secrets: secrets/gcal.env.enc
  gcal_write:
    secrets: secrets/gcal_write.env.enc
  gmail_readonly:
    secrets: secrets/gmail.env.enc
  gmail_send:
    secrets: secrets/gmail_send.env.enc
  gmail_modify:
    secrets: secrets/gmail_modify.env.enc
  drive:
    secrets: secrets/drive.env.enc
  drive_write:
    secrets: secrets/drive_write.env.enc
  google_docs:
    secrets: secrets/docs_read.env.enc
    tools:
      create_doc:
        secrets: secrets/docs_write.env.enc
      append_to_doc:
        secrets: secrets/docs_write.env.enc
      replace_in_doc:
        secrets: secrets/docs_write.env.enc
  google_sheets:
    secrets: secrets/sheets_read.env.enc
    tools:
      create_sheet:
        secrets: secrets/sheets_write.env.enc
      write_to_sheet:
        secrets: secrets/sheets_write.env.enc
      append_to_sheet:
        secrets: secrets/sheets_write.env.enc
  google_slides:
    secrets: secrets/slides_read.env.enc
    tools:
      create_slides:
        secrets: secrets/slides_write.env.enc
      add_slide:
        secrets: secrets/slides_write.env.enc
      replace_in_slides:
        secrets: secrets/slides_write.env.enc
  apple_notes: {}
  apple_reminders: {}
  apple_photos: {}
  brave_search:
    secrets: secrets/brave.env.enc
  tts: {}
  notion:
    secrets: secrets/notion_read.env.enc
    classify_output: true
  notion_write:
    secrets: secrets/notion_write.env.enc
    classify_output: true
  fetch_url: {}
  github:
    secrets: secrets/github.env.enc
  exec:
    timeout: 60
    mounts:
      - path: ~/.creel/workspace
        mode: rw
  exec_interactive:
    timeout: 300
  coding:
    writable: true
    memory: "512m"
    cpus: "1.0"
    tmpfs_size: "256M"
    timeout: 300
  file_ops: {}
  things: {}
  browser:
    tools:
      browser_navigate:
        classify_output: true
      browser_get_content:
        classify_output: true
      browser_click:
        classify_output: true
      browser_type:
        classify_output: true
      browser_screenshot:
        classify_output: true
      browser_links:
        classify_output: true
  git_ops:
    classify_output: true
  bluebubbles:
    enabled: false
  imessage_bridge: {}
  host_exec: {}

llm:
  model: claude-sonnet-4-20250514
  max_tokens: 4096
  secrets: secrets/anthropic.env.enc
  container_pool:
    enabled: false
    idle_timeout_seconds: 300
    max_containers: 2
  rate_limits:
    requests_per_minute: 30
    requests_per_hour: 500
    tokens_per_day: 1000000
    cost_per_day_usd: 10.00
    queue_timeout: 30.0
    enabled: true

agent:
  max_turns: 15

session:
  sessions_dir: sessions
  summarize_on_trim: true

bridge:
  enabled: true
  url: "http://localhost:8099"
  token: "$BRIDGE_TOKEN"

browser:
  enabled: true
  default_mode: managed
  cdp_url: "http://localhost:9222"
  max_sessions: 3
  session_timeout_minutes: 10
  container_memory: "1024m"
  container_shm_size: "256m"
  container_tmpfs_size: "128M"
  navigate_timeout_ms: 30000
  snapshot_timeout_ms: 15000
  block_heavy_resources: true

workspace:
  path: workspace
  timezone: "America/Denver"
  memory_days: 2
  memory_max_chars: 20000
  max_chars_per_file: 20000
  compact_after_days: 7
  max_daily_entries: 50
  max_long_term_lines: 500

knowledge_base:
  enabled: true
  store: sqlite
  embedding_model: all-MiniLM-L6-v2
  chunk_size: 512
  chunk_overlap: 50
  auto_index: []
  # auto_index:
  #   - ~/Documents/notes/
  #   - ~/projects/docs/

media:
  enabled: true
  storage_dir: ~/.creel/media
  max_file_size_mb: 20
  retention_days: 30
  transcription:
    backend: openai          # "openai" (Whisper API) or "local" (whisper CLI)
    model: whisper-1
    # api_key: null          # Falls back to OPENAI_API_KEY env var
  vision:
    max_pixels: 2048
    quality: 85

channels:
  # imessage:
  #   listen_to: "$PHONE"
  #   poll_interval: 3
  # bluebubbles:
  #   server_url: "$BLUEBUBBLES_URL"
  #   password: "$BLUEBUBBLES_PASSWORD"
  #   listen_to:
  #     - "$PHONE"
  #   poll_interval: 3
  telegram:
    secrets: secrets/telegram.env.enc
    mode: polling
    poll_timeout: 30
    send_typing: true
    allowed_senders:
      - "$TELEGRAM_ALLOWED_SENDER"

guardian:
  enabled: true
  debug: true
  review:
    timeout_seconds: 60
    default_on_timeout: deny
  fast_classifier:
    enabled: true
    threshold: 0.95
    model_name: protectai/deberta-v3-base-prompt-injection-v2
  llm_judge:
    enabled: false
  policy:
    enabled: true
    policy_file: policies/default.yaml
  coherence:
    enabled: true  # LLM-based check that tool calls match user intent
    model: claude-haiku-4-5-20251001
    max_tokens: 256
  audit:
    enabled: true
    log_file: guardian_audit.jsonl
