system_prompt: |
  You are a personal assistant running on Creel. Be concise and helpful.
  Today is {date}.

  ## Memory
  You wake up fresh each session. Files are your continuity:
  - **Daily notes:** `memory/YYYY-MM-DD.md` — raw logs of what happened
  - **Long-term:** `MEMORY.md` — curated important facts

  ### When to use memory tools
  - **`remember`**: Save important user facts immediately — location, preferences, names,
    account details, anything you'd need to know next session. Write with clear semantic
    context (e.g. "User's home location is Broomfield, CO" not just "Broomfield CO").
  - **`search_memory`**: Before answering questions about prior conversations, user
    preferences, or anything that might have been discussed before. Check memory first.
  - **`update_long_term_memory`**: For curated, distilled facts worth keeping permanently.
    User identity, preferences, key decisions, important context.
  - Don't ask permission to remember things. If it seems important, save it.
  - When the user says "remember this" or shares personal info (location, preferences,
    names, schedules), use `remember` immediately with descriptive context.

  ## Behavior
  - Be resourceful before asking. Try to figure it out, check memory, use tools. Then ask.
  - Have opinions. You're allowed to disagree or prefer things.
  - Skip filler phrases ("Great question!", "I'd be happy to help!"). Just help.
  - When in doubt about external actions (sending messages, emails), ask first.
  - Internal actions (reading files, searching, organizing) — just do them.

tools:
  check_calendar:
    executor: gcal
    network: true
    secrets: secrets/gcal.env.enc
    description: "Check today's calendar events"
    parameters:
      range:
        type: string
        description: "Time range: 'today' or 'week'"

  create_event:
    executor: gcal_write
    network: true
    secrets: secrets/gcal_write.env.enc
    description: "Create a calendar event"
    parameters:
      summary:
        type: string
        description: "Event title"
        required: true
      start:
        type: string
        description: "Start time (ISO 8601)"
        required: true
      end:
        type: string
        description: "End time (ISO 8601)"
        required: true
      description:
        type: string
        description: "Event description"
      location:
        type: string
        description: "Event location"

  check_email:
    executor: gmail_readonly
    network: true
    secrets: secrets/gmail.env.enc
    description: "Search Gmail for emails"
    parameters:
      query:
        type: string
        description: "Gmail search query (e.g., 'is:unread newer_than:1d')"
        required: true
      max_results:
        type: string
        description: "Max emails to return (default: 20)"

  read_email:
    executor: gmail_readonly
    network: true
    secrets: secrets/gmail.env.enc
    description: "Read the full content of a specific email by its ID"
    parameters:
      message_id:
        type: string
        description: "Gmail message ID (from check_email results)"
        required: true

  send_email:
    executor: gmail_send
    network: true
    secrets: secrets/gmail_send.env.enc
    description: "Send an email"
    parameters:
      to:
        type: string
        description: "Recipient email"
        required: true
      subject:
        type: string
        description: "Subject line"
        required: true
      body:
        type: string
        description: "Email body"
        required: true

  trash_email:
    executor: gmail_modify
    network: true
    secrets: secrets/gmail_modify.env.enc
    description: "Move an email to trash. Always include the subject."
    parameters:
      message_id:
        type: string
        description: "Gmail message ID"
        required: true
      subject:
        type: string
        description: "Email subject line (for confirmation display)"
        required: true
    fixed_args:
      action: "trash"

  mark_read:
    executor: gmail_modify
    network: true
    secrets: secrets/gmail_modify.env.enc
    description: "Mark an email as read"
    parameters:
      message_id:
        type: string
        description: "Gmail message ID"
        required: true
    fixed_args:
      action: "modify"
      remove_labels: "UNREAD"

  check_weather:
    executor: weather
    network: true
    description: "Get current weather and forecast"
    parameters:
      location:
        type: string
        description: "City name or coordinates"
        required: true

  check_drive:
    executor: drive
    network: true
    secrets: secrets/drive.env.enc
    description: "Search Google Drive files"
    parameters:
      query:
        type: string
        description: "Drive search query"
      max_results:
        type: string
        description: "Max files to return"

  upload_file:
    executor: drive_write
    network: true
    secrets: secrets/drive_write.env.enc
    description: "Upload a file to Google Drive"
    parameters:
      name:
        type: string
        description: "File name"
        required: true
      content:
        type: string
        description: "File content"
        required: true
      mime_type:
        type: string
        description: "MIME type (default: text/plain)"

  # Google Docs
  read_doc:
    executor: google_docs
    network: true
    secrets: secrets/docs_read.env.enc
    description: "Read the contents of a Google Doc as plain text"
    parameters:
      document_id:
        type: string
        description: "Google Docs document ID"
        required: true
    fixed_args:
      action: "read"

  create_doc:
    executor: google_docs
    network: true
    secrets: secrets/docs_write.env.enc
    description: "Create a new Google Doc"
    parameters:
      title:
        type: string
        description: "Document title"
        required: true
      body:
        type: string
        description: "Initial document body text"
    fixed_args:
      action: "create"

  append_to_doc:
    executor: google_docs
    network: true
    secrets: secrets/docs_write.env.enc
    description: "Append text to the end of a Google Doc"
    parameters:
      document_id:
        type: string
        description: "Google Docs document ID"
        required: true
      text:
        type: string
        description: "Text to append"
        required: true
    fixed_args:
      action: "append"

  replace_in_doc:
    executor: google_docs
    network: true
    secrets: secrets/docs_write.env.enc
    description: "Find and replace text in a Google Doc"
    parameters:
      document_id:
        type: string
        description: "Google Docs document ID"
        required: true
      find:
        type: string
        description: "Text to find"
        required: true
      replace_with:
        type: string
        description: "Replacement text"
        required: true
      match_case:
        type: string
        description: "Case-sensitive match (true/false, default: true)"
    fixed_args:
      action: "replace"

  # Google Sheets
  read_sheet:
    executor: google_sheets
    network: true
    secrets: secrets/sheets_read.env.enc
    description: "Read cell values from a Google Sheet"
    parameters:
      spreadsheet_id:
        type: string
        description: "Google Sheets spreadsheet ID"
        required: true
      range:
        type: string
        description: "A1 notation range (e.g. 'Sheet1!A1:B2')"
        required: true
    fixed_args:
      action: "read"

  create_sheet:
    executor: google_sheets
    network: true
    secrets: secrets/sheets_write.env.enc
    description: "Create a new Google Sheet"
    parameters:
      title:
        type: string
        description: "Spreadsheet title"
        required: true
      sheet_name:
        type: string
        description: "Name of the first sheet"
      data:
        type: string
        description: "Initial data as JSON 2D array (e.g. '[[\"Name\",\"Age\"],[\"Alice\",\"30\"]]')"
    fixed_args:
      action: "create"

  write_to_sheet:
    executor: google_sheets
    network: true
    secrets: secrets/sheets_write.env.enc
    description: "Write values to a range in a Google Sheet"
    parameters:
      spreadsheet_id:
        type: string
        description: "Google Sheets spreadsheet ID"
        required: true
      range:
        type: string
        description: "A1 notation range (e.g. 'Sheet1!A1:B2')"
        required: true
      data:
        type: string
        description: "Data as JSON 2D array (e.g. '[[\"Name\",\"Age\"],[\"Alice\",\"30\"]]')"
        required: true
      value_input_option:
        type: string
        description: "How to interpret input: USER_ENTERED (default) or RAW"
    fixed_args:
      action: "write"

  append_to_sheet:
    executor: google_sheets
    network: true
    secrets: secrets/sheets_write.env.enc
    description: "Append rows to the end of a Google Sheet"
    parameters:
      spreadsheet_id:
        type: string
        description: "Google Sheets spreadsheet ID"
        required: true
      range:
        type: string
        description: "A1 notation range to search for data (e.g. 'Sheet1!A:B')"
        required: true
      data:
        type: string
        description: "Rows as JSON 2D array (e.g. '[[\"Bob\",\"25\"]]')"
        required: true
      value_input_option:
        type: string
        description: "How to interpret input: USER_ENTERED (default) or RAW"
    fixed_args:
      action: "append"

  # Google Slides
  read_slides:
    executor: google_slides
    network: true
    secrets: secrets/slides_read.env.enc
    description: "Read presentation metadata and slide text content"
    parameters:
      presentation_id:
        type: string
        description: "Google Slides presentation ID"
        required: true
    fixed_args:
      action: "read"

  create_slides:
    executor: google_slides
    network: true
    secrets: secrets/slides_write.env.enc
    description: "Create a new Google Slides presentation"
    parameters:
      title:
        type: string
        description: "Presentation title"
        required: true
    fixed_args:
      action: "create"

  add_slide:
    executor: google_slides
    network: true
    secrets: secrets/slides_write.env.enc
    description: "Add a slide to a Google Slides presentation"
    parameters:
      presentation_id:
        type: string
        description: "Google Slides presentation ID"
        required: true
      title:
        type: string
        description: "Slide title text"
      body:
        type: string
        description: "Slide body text"
      layout:
        type: string
        description: "Predefined layout (default: BLANK)"
    fixed_args:
      action: "add_slide"

  replace_in_slides:
    executor: google_slides
    network: true
    secrets: secrets/slides_write.env.enc
    description: "Find and replace text across all slides in a presentation"
    parameters:
      presentation_id:
        type: string
        description: "Google Slides presentation ID"
        required: true
      find:
        type: string
        description: "Text to find"
        required: true
      replace_with:
        type: string
        description: "Replacement text"
        required: true
      match_case:
        type: string
        description: "Case-sensitive match (true/false, default: true)"
    fixed_args:
      action: "replace_text"

  # BlueBubbles tools (commented out — secrets not configured yet)
  # check_messages:
  #   executor: bluebubbles
  #   secrets: secrets/bluebubbles.env.enc
  #   description: "Check recent iMessages"
  #   parameters:
  #     chat_id:
  #       type: string
  #       description: "Specific chat to check (optional)"
  #     limit:
  #       type: string
  #       description: "Number of messages (max 50)"
  #
  # send_imessage:
  #   executor: bluebubbles_send
  #   secrets: secrets/bluebubbles.env.enc
  #   description: "Send an iMessage"
  #   parameters:
  #     chat_id:
  #       type: string
  #       description: "Chat to send to"
  #       required: true
  #     text:
  #       type: string
  #       description: "Message text (max 2000 chars)"
  #       required: true
  #
  # react_imessage:
  #   executor: bluebubbles_react
  #   secrets: secrets/bluebubbles.env.enc
  #   description: "React to an iMessage with a tapback"
  #   parameters:
  #     chat_id:
  #       type: string
  #       description: "Chat ID"
  #       required: true
  #     message_guid:
  #       type: string
  #       description: "Message GUID to react to"
  #       required: true
  #     reaction:
  #       type: string
  #       description: "Reaction type (love, like, dislike, laugh, emphasis, question)"
  #       required: true
  #
  # get_chats:
  #   executor: bluebubbles_chats
  #   secrets: secrets/bluebubbles.env.enc
  #   description: "List recent iMessage chats"
  #   parameters:
  #     limit:
  #       type: string
  #       description: "Number of chats to return (max 50)"

  # Apple Notes
  list_notes:
    executor: apple_notes
    network: true
    bridge: true
    description: "List notes from Apple Notes"
    parameters:
      folder:
        type: string
        description: "Notes folder (default: Notes)"
    fixed_args:
      action: "list"

  search_notes:
    executor: apple_notes
    network: true
    bridge: true
    description: "Search Apple Notes by text content"
    parameters:
      query:
        type: string
        description: "Search query"
        required: true
    fixed_args:
      action: "search"

  read_note:
    executor: apple_notes
    network: true
    bridge: true
    description: "Read the full content of a note by title"
    parameters:
      name:
        type: string
        description: "Note title"
        required: true
    fixed_args:
      action: "read"

  create_note:
    executor: apple_notes
    network: true
    bridge: true
    description: "Create a new note in Apple Notes"
    parameters:
      title:
        type: string
        description: "Note title"
        required: true
      body:
        type: string
        description: "Note content"
        required: true
      folder:
        type: string
        description: "Target folder (default: Notes)"
    fixed_args:
      action: "create"

  # Apple Reminders
  list_reminders:
    executor: apple_reminders
    bridge: true
    network: true
    description: "List reminders from Apple Reminders"
    parameters:
      list_name:
        type: string
        description: "Reminder list name (default: Reminders)"
    fixed_args:
      action: "list"

  create_reminder:
    executor: apple_reminders
    bridge: true
    network: true
    description: "Create a new reminder"
    parameters:
      title:
        type: string
        description: "Reminder title"
        required: true
      due_date:
        type: string
        description: "Due date (ISO 8601, e.g. 2024-03-15T09:00:00)"
      notes:
        type: string
        description: "Additional notes"
      list_name:
        type: string
        description: "Reminder list (default: Reminders)"
    fixed_args:
      action: "add"

  complete_reminder:
    executor: apple_reminders
    network: true
    bridge: true
    description: "Mark a reminder as completed"
    parameters:
      name:
        type: string
        description: "Reminder title"
        required: true
      list_name:
        type: string
        description: "Reminder list (default: Reminders)"
    fixed_args:
      action: "complete"

  get_reminder_lists:
    executor: apple_reminders
    network: true
    bridge: true
    description: "List available reminder lists"
    parameters: {}
    fixed_args:
      action: "lists"

  # Web Search
  web_search:
    executor: brave_search
    secrets: secrets/brave.env.enc
    network: true
    description: "Search the web using Brave Search"
    parameters:
      query:
        type: string
        description: "Search query"
        required: true
      count:
        type: string
        description: "Number of results (default: 5, max: 20)"

  notion_api:
    executor: notion
    secrets: secrets/notion_read.env.enc
    network: true
    classify_output: true
    description: "Query Notion in read-only mode (search, retrieve page, query database)"
    parameters:
      action:
        type: string
        description: "Action: search, retrieve_page, query_database"
        required: true
      query:
        type: string
        description: "Search text for action='search'"
      page_id:
        type: string
        description: "Notion page ID for action='retrieve_page'"
      database_id:
        type: string
        description: "Notion database ID for action='query_database'"
      filter_json:
        type: string
        description: "JSON object filter for action='query_database'"
      sorts_json:
        type: string
        description: "JSON array of sort objects for action='query_database'"
      page_size:
        type: string
        description: "Results page size (1-100, default 20)"
      start_cursor:
        type: string
        description: "Pagination cursor for search/query_database"

  notion_write:
    executor: notion_write
    secrets: secrets/notion_write.env.enc
    network: true
    classify_output: true
    description: "Create, update, or delete pages in Notion"
    parameters:
      action:
        type: string
        description: "Action: create_page, update_page, append_blocks, delete_page"
        required: true
      page_id:
        type: string
        description: "Page ID (required for update_page, append_blocks, delete_page)"
      database_id:
        type: string
        description: "Database ID (required for create_page)"
      properties_json:
        type: string
        description: "JSON object of page properties (for create_page, update_page)"
      children_json:
        type: string
        description: "JSON array of block objects to append (for append_blocks, create_page)"

  fetch_url:
    executor: fetch_url
    network: true
    description: "Fetch and extract text content from a URL"
    parameters:
      url:
        type: string
        description: "URL to fetch"
        required: true
      max_chars:
        type: string
        description: "Max characters to return (default: 10000)"

  # GitHub (gh CLI)
  github:
    executor: github
    network: true
    secrets: secrets/github.env.enc
    # host_auth: true  # Alternative: mount ~/.config/gh instead of using a PAT
    description: "Manage GitHub repositories — issues, PRs, CI runs, code search"
    parameters:
      command:
        type: string
        description: "The gh CLI subcommand to run (e.g., 'issue list', 'pr view 42', 'run list')"
        required: true
      repo:
        type: string
        description: "Repository in owner/repo format. Uses current repo context if not specified."

  # Shell exec
  exec:
    executor: exec
    description: "Run shell commands in a sandboxed environment"
    parameters:
      command:
        type: string
        description: "Shell command to execute"
        required: true
      workdir:
        type: string
        description: "Working directory (must be within a mounted path)"
    mounts:
      - path: ~/.creel/workspace
        mode: rw
    network: false

  # Interactive/PTY exec — SSH, REPLs, editors, etc.
  exec_interactive:
    executor: exec_interactive
    description: "Start and manage interactive terminal sessions (SSH, REPLs, etc.)"
    network: true
    timeout: 300
    parameters:
      action:
        type: string
        description: "Action: start, send_input, read_output, resize, close, info, list_sessions, get_io_log"
        required: true
      command:
        type: string
        description: "Shell command to run in PTY (required for 'start' action)"
      session_id:
        type: string
        description: "Session ID (required for send_input, read_output, resize, close, info)"
      input:
        type: string
        description: "Input to send to the session (for 'send_input' action, include \\n for Enter)"
      timeout:
        type: number
        description: "Hard timeout in seconds (for 'start' action, default 300)"
      cols:
        type: number
        description: "Terminal width in columns (default 120)"
      rows:
        type: number
        description: "Terminal height in rows (default 40)"
      read_timeout:
        type: number
        description: "How long to wait for output in seconds (for 'read_output', default 10)"

  # Coding / dev environment
  coding:
    executor: coding
    writable: true
    memory: "512m"
    cpus: "1.0"
    tmpfs_size: "256M"
    network: true
    timeout: 300
    description: "Development environment for building software — run commands, install packages, edit files"
    parameters:
      command:
        type: string
        description: "Shell command to execute in the dev container (e.g., 'python -m pytest', 'npm install', 'git status')"
        required: true
      workdir:
        type: string
        description: "Working directory inside the container. Maps to a mounted host path."
      mount:
        type: string
        description: "Host path to mount into the container at /workspace. Allows working on real projects."

  # File operations
  read_file:
    executor: file_ops
    description: "Read a file from the workspace"
    parameters:
      file_path:
        type: string
        description: "Path relative to workspace root"
        required: true
      offset:
        type: string
        description: "Line offset to start reading from, as a number (0-based)"
      limit:
        type: string
        description: "Max number of lines to return, as a number"
    fixed_args:
      action: "read"

  write_file:
    executor: file_ops
    description: "Write content to a file in the workspace"
    parameters:
      file_path:
        type: string
        description: "Path relative to workspace root"
        required: true
      content:
        type: string
        description: "Content to write"
        required: true
    fixed_args:
      action: "write"

  edit_file:
    executor: file_ops
    description: "Edit a file by replacing text"
    parameters:
      file_path:
        type: string
        description: "Path relative to workspace root"
        required: true
      old_text:
        type: string
        description: "Text to find and replace"
        required: true
      new_text:
        type: string
        description: "Replacement text"
        required: true
    fixed_args:
      action: "edit"

  list_files:
    executor: file_ops
    description: "List files in a workspace directory"
    parameters:
      directory:
        type: string
        description: "Directory path relative to workspace root (default: root)"
      pattern:
        type: string
        description: "Glob pattern to filter files (default: *)"
      recursive:
        type: string
        description: "List recursively (true/false, default: false)"
    fixed_args:
      action: "list"

  # Things 3 (via bridge)
  list_things:
    executor: things
    bridge: true
    network: true
    description: "List tasks from Things 3 (default: inbox). Use action parameter to choose view."
    parameters:
      action:
        type: string
        description: "View to list: inbox, today, upcoming, projects, or search (requires query param)"
      query:
        type: string
        description: "Search query (only used when action is 'search')"
    fixed_args: {}

  create_things_task:
    executor: things
    network: true
    bridge: true
    description: "Create a new task in Things 3"
    parameters:
      title:
        type: string
        description: "Task title"
        required: true
      notes:
        type: string
        description: "Task notes/description"
      when:
        type: string
        description: "Schedule: today, evening, tomorrow, or specific date"
      deadline:
        type: string
        description: "Deadline date (YYYY-MM-DD format)"
      tags:
        type: string
        description: "Comma-separated tag names"
      list:
        type: string
        description: "Area or project name"
    fixed_args:
      action: "add"

  complete_things_task:
    executor: things
    network: true
    bridge: true
    description: "Mark a Things 3 task as completed"
    parameters:
      id:
        type: string
        description: "Task ID to complete (use list_things to find IDs)"
        required: true
    fixed_args:
      action: "update"
      completed: "true"

  # Browser tools (via bridge)
  browser_open:
    executor: browser
    network: true
    bridge: true
    description: "Open a new browser session. Modes: 'managed' (Docker headless), 'native' (local Chrome subprocess), or 'relay' (user's Chrome)"
    parameters:
      mode:
        type: string
        description: "Session mode: 'managed' (isolated Docker headless), 'native' (local Chrome, no Docker), or 'relay' (user's Chrome)"
      cdp_url:
        type: string
        description: "Chrome CDP URL for relay mode (e.g., http://localhost:9222)"
    fixed_args:
      action: "connect"

  browser_navigate:
    executor: browser
    network: true
    bridge: true
    description: "Navigate to a URL and return the page content as a structured accessibility tree"
    classify_output: true
    parameters:
      session_id:
        type: string
        description: "Browser session ID from browser_open"
        required: true
      url:
        type: string
        description: "URL to navigate to"
        required: true
    fixed_args:
      action: "navigate"

  browser_get_content:
    executor: browser
    network: true
    bridge: true
    description: "Get the current page content as a structured accessibility tree"
    classify_output: true
    parameters:
      session_id:
        type: string
        description: "Browser session ID"
        required: true
      selector:
        type: string
        description: "Optional CSS selector to scope content extraction"
    fixed_args:
      action: "content"

  browser_click:
    executor: browser
    network: true
    bridge: true
    description: "Click an element on the page by CSS selector"
    classify_output: true
    parameters:
      session_id:
        type: string
        description: "Browser session ID"
        required: true
      selector:
        type: string
        description: "CSS selector for the element to click"
        required: true
    fixed_args:
      action: "click"

  browser_type:
    executor: browser
    network: true
    bridge: true
    description: "Type text into an input element"
    classify_output: true
    parameters:
      session_id:
        type: string
        description: "Browser session ID"
        required: true
      selector:
        type: string
        description: "CSS selector for the input element"
        required: true
      text:
        type: string
        description: "Text to type"
        required: true
    fixed_args:
      action: "type"

  browser_screenshot:
    executor: browser
    network: true
    bridge: true
    description: "Take a screenshot of the current page (returns base64 PNG)"
    classify_output: true
    parameters:
      session_id:
        type: string
        description: "Browser session ID"
        required: true
      full_page:
        type: boolean
        description: "Capture full scrollable page (default: false)"
    fixed_args:
      action: "screenshot"

  browser_links:
    executor: browser
    network: true
    bridge: true
    description: "Get all links on the current page with their text and URLs"
    classify_output: true
    parameters:
      session_id:
        type: string
        description: "Browser session ID"
        required: true
    fixed_args:
      action: "links"

  browser_close:
    executor: browser
    network: true
    bridge: true
    description: "Close a browser session and free resources"
    parameters:
      session_id:
        type: string
        description: "Browser session ID"
        required: true
    fixed_args:
      action: "close"

  # Git operations (via bridge)
  git_status:
    executor: git_ops
    network: true
    bridge: true
    classify_output: true
    description: "Get git repository status"
    parameters:
      short:
        type: boolean
        description: "Use short format output"
    fixed_args:
      action: "status"

  git_diff:
    executor: git_ops
    network: true
    bridge: true
    classify_output: true
    description: "Show git diff of working tree changes"
    parameters:
      cached:
        type: boolean
        description: "Show staged changes (--cached)"
      diff_path:
        type: string
        description: "Limit diff to specific file path"
    fixed_args:
      action: "diff"

  git_log:
    executor: git_ops
    network: true
    bridge: true
    classify_output: true
    description: "Show git commit log"
    parameters:
      max_count:
        type: integer
        description: "Maximum number of commits to show (default: 10)"
      oneline:
        type: boolean
        description: "Use one-line format (default: true)"
    fixed_args:
      action: "log"

  git_commit:
    executor: git_ops
    network: true
    bridge: true
    description: "Create a git commit"
    parameters:
      message:
        type: string
        description: "Commit message"
        required: true
      all:
        type: boolean
        description: "Stage all modified files before committing (-a)"
    fixed_args:
      action: "commit"

  git_branch:
    executor: git_ops
    network: true
    bridge: true
    description: "List or manage git branches"
    parameters:
      name:
        type: string
        description: "Branch name to create or delete"
      delete:
        type: boolean
        description: "Delete the specified branch"
      list_all:
        type: boolean
        description: "List all branches including remotes"
    fixed_args:
      action: "branch"

  git_push:
    executor: git_ops
    network: true
    bridge: true
    description: "Push commits to remote repository"
    parameters:
      remote:
        type: string
        description: "Remote name (default: origin)"
      branch:
        type: string
        description: "Branch name to push"
      set_upstream:
        type: boolean
        description: "Set upstream tracking (-u)"
    fixed_args:
      action: "push"

  # iMessage Bridge (for broader iMessage access)
  imessage_send:
    executor: imessage_bridge
    network: true
    bridge: true
    description: "Send iMessage via bridge (broader recipient support)"
    parameters:
      recipient:
        type: string
        description: "Phone number or email address"
        required: true
      text:
        type: string
        description: "Message text"
        required: true
    fixed_args:
      action: "send"

llm:
  model: claude-sonnet-4-20250514
  max_tokens: 4096
  secrets: secrets/anthropic.env.enc
  container_pool:
    enabled: false
    idle_timeout_seconds: 300
    max_containers: 2

agent:
  max_turns: 15

session:
  sessions_dir: sessions
  max_history: 50
  summarize_on_trim: true

bridge:
  enabled: true
  url: "http://localhost:8099"
  token: "$BRIDGE_TOKEN"

browser:
  enabled: true
  default_mode: managed
  cdp_url: "http://localhost:9222"
  max_sessions: 3
  session_timeout_minutes: 10
  container_memory: "1024m"
  container_shm_size: "256m"
  container_tmpfs_size: "128M"
  navigate_timeout_ms: 30000
  snapshot_timeout_ms: 15000
  block_heavy_resources: true

workspace:
  path: workspace
  timezone: "America/Denver"
  memory_days: 2
  memory_max_chars: 20000
  max_chars_per_file: 20000
  compact_after_days: 7
  max_daily_entries: 50
  max_long_term_lines: 500

media:
  enabled: true
  storage_dir: ~/.creel/media
  max_file_size_mb: 20
  retention_days: 30
  transcription:
    backend: openai          # "openai" (Whisper API) or "local" (whisper CLI)
    model: whisper-1
    # api_key: null          # Falls back to OPENAI_API_KEY env var
  vision:
    max_pixels: 2048
    quality: 85

channels:
  # imessage:
  #   listen_to: "$PHONE"
  #   poll_interval: 3
  # bluebubbles:
  #   server_url: "$BLUEBUBBLES_URL"
  #   password: "$BLUEBUBBLES_PASSWORD"
  #   listen_to:
  #     - "$PHONE"
  #   poll_interval: 3
  telegram:
    secrets: secrets/telegram.env.enc
    mode: polling
    poll_timeout: 30
    send_typing: true
    allowed_senders:
      - "$TELEGRAM_ALLOWED_SENDER"

guardian:
  enabled: true
  debug: true
  review:
    timeout_seconds: 60
    default_on_timeout: deny
  fast_classifier:
    enabled: true
    threshold: 0.95
    model_name: protectai/deberta-v3-base-prompt-injection-v2
  llm_judge:
    enabled: false
  policy:
    enabled: true
    policy_file: policies/default.yaml
  coherence:
    enabled: true  # LLM-based check that tool calls match user intent
    model: claude-haiku-4-5-20251001
    max_tokens: 256
  audit:
    enabled: true
    log_file: guardian_audit.jsonl
