allow:
  - check_weather
  - check_calendar
  - check_email
  - read_email
  - check_drive
  - check_messages
  - get_chats
  - react_imessage

review:
  - send_*
  - upload_*
  - create_*
  - mark_*
  - trash_*

deny:
  - delete_*

# Tools that match 'review' rules but can skip human approval
auto_approve:
  - mark_read
  - react_imessage
