allow:
  - check_weather
  - check_calendar
  - check_email
  - read_email
  - check_drive
  - check_messages
  - get_chats
  - react_imessage
  - list_notes
  - search_notes
  - read_note
  - list_reminders
  - get_reminder_lists
  - web_search
  - fetch_url

review:
  - send_*
  - upload_*
  - create_*
  - complete_*
  - mark_*
  - trash_*

deny:
  - delete_*

# Tools that match 'review' rules but can skip human approval
auto_approve:
  - mark_read
  - react_imessage
