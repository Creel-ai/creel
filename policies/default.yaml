allow:
  - check_weather
  - check_calendar
  - check_email
  - read_email
  - check_drive
  - check_messages
  - get_chats
  - react_imessage
  - list_notes
  - search_notes
  - read_note
  - list_reminders
  - get_reminder_lists
  - web_search
  - fetch_url
  # Browser tools (read-only)
  - browser_get_content
  - browser_links
  - browser_close
  # Memory tools (writes are gated by Guardian content screening)
  - remember
  - search_memory
  - list_memory_files
  - update_long_term_memory

review:
  - send_*
  - upload_*
  - create_*
  - complete_*
  - mark_*
  - trash_*
  - edit_memory
  # Browser tools (state-changing)
  - browser_open
  - browser_navigate
  - browser_click
  - browser_type
  - browser_screenshot

deny:
  - delete_*

deny_when:
  - tool: browser_navigate
    arg: url
    pattern: "file://*"
  - tool: browser_navigate
    arg: url
    pattern: "javascript:*"
  - tool: browser_navigate
    arg: url
    pattern: "data:*"

# Tools that match 'review' rules but can skip human approval
auto_approve:
  - mark_read
  - react_imessage
  - remember
  - search_memory
  - list_memory_files
  - update_long_term_memory
