# Conditional deny rules — block dangerous shell patterns in exec commands
# Tier 1-4 (Block): Shell injection, reverse shells, destructive commands
deny_when:
  # Destructive filesystem commands
  - tool: exec
    arg: command
    pattern: "*rm -rf*"
  - tool: exec
    arg: command
    pattern: "*rm -fr*"
  - tool: exec
    arg: command
    pattern: "*mkfs*"
  - tool: exec
    arg: command
    pattern: "*dd if=*of=/dev/*"
  # Reverse shell / exfiltration patterns
  - tool: exec
    arg: command
    pattern: "*>/dev/tcp/*"
  - tool: exec
    arg: command
    pattern: "*/dev/udp/*"
  - tool: exec
    arg: command
    pattern: "*bash -i*"
  - tool: exec
    arg: command
    pattern: "*nc -e*"
  - tool: exec
    arg: command
    pattern: "*ncat -e*"
  # Pipe to shell (command injection via download)
  # NOTE: fnmatch glob matching may false-positive on args containing "| sh"
  # as a substring in non-pipe context. Acceptable trade-off for security.
  - tool: exec
    arg: command
    pattern: "*| bash*"
  - tool: exec
    arg: command
    pattern: "*| sh*"
  - tool: exec
    arg: command
    pattern: "*|bash*"
  - tool: exec
    arg: command
    pattern: "*|sh*"
  - tool: exec
    arg: command
    pattern: "*curl*|*sh*"
  - tool: exec
    arg: command
    pattern: "*wget*|*sh*"
  # Command substitution in curl/wget payloads
  - tool: exec
    arg: command
    pattern: "*$(curl*"
  - tool: exec
    arg: command
    pattern: "*$(wget*"
  # Fork bomb
  - tool: exec
    arg: command
    pattern: "*:(){ :|:& };:*"
  # Crontab modification
  - tool: exec
    arg: command
    pattern: "*crontab*"
  # chmod 777 (overly permissive)
  - tool: exec
    arg: command
    pattern: "*chmod 777*"
  - tool: exec
    arg: command
    pattern: "*chmod -R 777*"
  # Interactive PTY: block same dangerous patterns as exec
  - tool: exec_interactive
    arg: command
    pattern: "*rm -rf*"
  - tool: exec_interactive
    arg: command
    pattern: "*rm -fr*"
  - tool: exec_interactive
    arg: command
    pattern: "*mkfs*"
  - tool: exec_interactive
    arg: command
    pattern: "*dd if=*of=/dev/*"
  - tool: exec_interactive
    arg: command
    pattern: "*>/dev/tcp/*"
  - tool: exec_interactive
    arg: command
    pattern: "*/dev/udp/*"
  - tool: exec_interactive
    arg: command
    pattern: "*bash -i*"
  - tool: exec_interactive
    arg: command
    pattern: "*nc -e*"
  - tool: exec_interactive
    arg: command
    pattern: "*ncat -e*"
  - tool: exec_interactive
    arg: command
    pattern: "*| bash*"
  - tool: exec_interactive
    arg: command
    pattern: "*| sh*"
  - tool: exec_interactive
    arg: command
    pattern: "*|bash*"
  - tool: exec_interactive
    arg: command
    pattern: "*|sh*"
  - tool: exec_interactive
    arg: command
    pattern: "*curl*|*sh*"
  - tool: exec_interactive
    arg: command
    pattern: "*wget*|*sh*"
  - tool: exec_interactive
    arg: command
    pattern: "*$(curl*"
  - tool: exec_interactive
    arg: command
    pattern: "*$(wget*"
  - tool: exec_interactive
    arg: command
    pattern: "*:(){ :|:& };:*"
  - tool: exec_interactive
    arg: command
    pattern: "*crontab*"
  - tool: exec_interactive
    arg: command
    pattern: "*chmod 777*"
  - tool: exec_interactive
    arg: command
    pattern: "*chmod -R 777*"
  # Coding tool: block same dangerous patterns as exec
  # NOTE: The executor also enforces a blocklist internally
  # (see src/executors/coding/executor.py). Keep both in sync.
  - tool: coding
    arg: command
    pattern: "*rm -rf*"
  - tool: coding
    arg: command
    pattern: "*rm -fr*"
  - tool: coding
    arg: command
    pattern: "*mkfs*"
  - tool: coding
    arg: command
    pattern: "*dd if=*of=/dev/*"
  - tool: coding
    arg: command
    pattern: "*>/dev/tcp/*"
  - tool: coding
    arg: command
    pattern: "*/dev/udp/*"
  - tool: coding
    arg: command
    pattern: "*bash -i*"
  - tool: coding
    arg: command
    pattern: "*nc -e*"
  - tool: coding
    arg: command
    pattern: "*ncat -e*"
  - tool: coding
    arg: command
    pattern: "*| bash*"
  - tool: coding
    arg: command
    pattern: "*| sh*"
  - tool: coding
    arg: command
    pattern: "*|bash*"
  - tool: coding
    arg: command
    pattern: "*|sh*"
  - tool: coding
    arg: command
    pattern: "*curl*|*sh*"
  - tool: coding
    arg: command
    pattern: "*wget*|*sh*"
  - tool: coding
    arg: command
    pattern: "*$(curl*"
  - tool: coding
    arg: command
    pattern: "*$(wget*"
  - tool: coding
    arg: command
    pattern: "*:(){ :|:& };:*"
  - tool: coding
    arg: command
    pattern: "*crontab*"
  - tool: coding
    arg: command
    pattern: "*chmod 777*"
  - tool: coding
    arg: command
    pattern: "*chmod -R 777*"
  # Coding tool: block mounting system paths
  - tool: coding
    arg: mount
    pattern: "/"
  - tool: coding
    arg: mount
    pattern: "/etc*"
  - tool: coding
    arg: mount
    pattern: "/var*"
  - tool: coding
    arg: mount
    pattern: "/usr*"
  - tool: coding
    arg: mount
    pattern: "/bin*"
  - tool: coding
    arg: mount
    pattern: "/sbin*"
  - tool: coding
    arg: mount
    pattern: "/boot*"
  - tool: coding
    arg: mount
    pattern: "/dev*"
  - tool: coding
    arg: mount
    pattern: "/sys*"
  - tool: coding
    arg: mount
    pattern: "/proc*"
  # GitHub: block destructive operations
  # NOTE: The executor also enforces an allowlist of subcommands
  # (see src/executors/github/executor.py). Keep both in sync.
  - tool: github
    arg: command
    pattern: "repo delete*"
  - tool: github
    arg: command
    pattern: "issue delete*"
  - tool: github
    arg: command
    pattern: "*--admin*"
  - tool: github
    arg: command
    pattern: "api*-X DELETE*"
  - tool: github
    arg: command
    pattern: "api*--method DELETE*"
  - tool: github
    arg: command
    pattern: "api*-X PUT*"
  - tool: github
    arg: command
    pattern: "api*--method PUT*"
  - tool: github
    arg: command
    pattern: "api*-X PATCH*"
  - tool: github
    arg: command
    pattern: "api*--method PATCH*"
  # URL scheme allowlist (http/https only) is enforced in BrowserRelay._validate_url.
  # These rules provide defense-in-depth at the policy layer.
  - tool: browser_navigate
    arg: url
    pattern: "file://*"
  - tool: browser_navigate
    arg: url
    pattern: "javascript:*"
  - tool: browser_navigate
    arg: url
    pattern: "data:*"
  - tool: browser_navigate
    arg: url
    pattern: "blob:*"
  - tool: browser_navigate
    arg: url
    pattern: "ftp://*"
  - tool: browser_navigate
    arg: url
    pattern: "chrome://*"
  - tool: browser_navigate
    arg: url
    pattern: "chrome-extension://*"

# Conditional review rules — flag risky but potentially legitimate commands
# Tier 5-6 (Warn): Credential exposure, dangerous git ops
# Tier 7-9 (Log): System modification, network access, exfiltration patterns
review_when:
  # Credential/env exposure — broad patterns, may flag benign commands
  # containing "env" + "KEY"/"SECRET" etc. Prefer false positives for safety.
  - tool: exec
    arg: command
    pattern: "*env*KEY*"
  - tool: exec
    arg: command
    pattern: "*env*SECRET*"
  - tool: exec
    arg: command
    pattern: "*env*TOKEN*"
  - tool: exec
    arg: command
    pattern: "*env*PASSWORD*"
  # Dangerous git operations
  - tool: exec
    arg: command
    pattern: "*git push --force*"
  - tool: exec
    arg: command
    pattern: "*git push -f*"
  - tool: exec
    arg: command
    pattern: "*git reset --hard*"
  # System modification
  - tool: exec
    arg: command
    pattern: "*sudo*"
  # Network access tools
  - tool: exec
    arg: command
    pattern: "*ssh *"
  - tool: exec
    arg: command
    pattern: "*scp *"
  # Data exfiltration patterns
  - tool: exec
    arg: command
    pattern: "*tar*|*curl*"
  - tool: exec
    arg: command
    pattern: "*zip*|*curl*"
  # Interactive PTY: flag risky but legitimate commands for review
  - tool: exec_interactive
    arg: command
    pattern: "*env*KEY*"
  - tool: exec_interactive
    arg: command
    pattern: "*env*SECRET*"
  - tool: exec_interactive
    arg: command
    pattern: "*env*TOKEN*"
  - tool: exec_interactive
    arg: command
    pattern: "*env*PASSWORD*"
  - tool: exec_interactive
    arg: command
    pattern: "*git push --force*"
  - tool: exec_interactive
    arg: command
    pattern: "*git push -f*"
  - tool: exec_interactive
    arg: command
    pattern: "*git reset --hard*"
  - tool: exec_interactive
    arg: command
    pattern: "*sudo*"
  # Coding tool: flag risky but legitimate commands for review
  - tool: coding
    arg: command
    pattern: "*env*KEY*"
  - tool: coding
    arg: command
    pattern: "*env*SECRET*"
  - tool: coding
    arg: command
    pattern: "*env*TOKEN*"
  - tool: coding
    arg: command
    pattern: "*env*PASSWORD*"
  - tool: coding
    arg: command
    pattern: "*git push --force*"
  - tool: coding
    arg: command
    pattern: "*git push -f*"
  - tool: coding
    arg: command
    pattern: "*git reset --hard*"
  - tool: coding
    arg: command
    pattern: "*sudo*"
  - tool: coding
    arg: command
    pattern: "*ssh *"
  - tool: coding
    arg: command
    pattern: "*scp *"
  # GitHub: flag state-changing operations for review
  # NOTE: The executor also enforces an allowlist of subcommands
  # (see src/executors/github/executor.py). Keep both in sync.
  - tool: github
    arg: command
    pattern: "pr merge*"
  - tool: github
    arg: command
    pattern: "issue close*"
  - tool: github
    arg: command
    pattern: "pr close*"
  - tool: github
    arg: command
    pattern: "issue create*"
  - tool: github
    arg: command
    pattern: "pr create*"
  - tool: github
    arg: command
    pattern: "issue comment*"
  - tool: github
    arg: command
    pattern: "pr comment*"
  - tool: github
    arg: command
    pattern: "issue reopen*"
  - tool: github
    arg: command
    pattern: "pr reopen*"
  - tool: github
    arg: command
    pattern: "api*-X POST*"
  - tool: github
    arg: command
    pattern: "api*--method POST*"
  # Notion is read-only by default; flag write-like actions for explicit review.
  # NOTE: The executor also enforces a READ_ONLY_ACTIONS allowlist
  # (see src/executors/notion/executor.py). Keep both in sync.
  - tool: notion_api
    arg: action
    pattern: "create*"
  - tool: notion_api
    arg: action
    pattern: "update*"
  - tool: notion_api
    arg: action
    pattern: "delete*"
  - tool: notion_api
    arg: action
    pattern: "archive*"

# Tools that match 'review' rules but can skip human approval
auto_approve:
  - mark_read
  - react_imessage
  - remember
  - search_memory
  - list_memory_files
  - update_long_term_memory
  - edit_memory
  # Things 3 task management
  - create_things_task
  - complete_things_task
  # Notes
  - create_note
  # Reminders
  - create_reminder
  - complete_reminder
  # Browser tools — auto-approve; risky URLs are blocked by deny_when rules
  - browser_open
  - browser_navigate
  - browser_click
  - browser_type
  - browser_screenshot
  # File operations — writes are sandboxed to the approved workspace by the
  # executor's _safe_path. set_workspace requires explicit REVIEW approval,
  # and workspace key is stripped from LLM input to prevent injection bypass.
  - write_file
  - edit_file
