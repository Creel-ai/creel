[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-taskrunner"
version = "0.1.0"
description = "Secure, scheduled LLM task runner with isolated fetchers"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "apscheduler>=3.10.0,<4.0.0",
    "pyyaml>=6.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "certifi>=2024.0.0",
    "truststore>=0.10.0",  # Use OS cert store (fixes uv-managed Python SSL)
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyrage>=1.2.0",
    "textual>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0",
]
guardian = [
    "transformers>=4.36.0",
    "onnxruntime>=1.16.0",
    "optimum[onnxruntime]>=1.14.0",
]
whatsapp = [
    "neonize>=1.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
creel = "taskrunner.cli:main"

[project.entry-points."creel.channels"]
imessage = "taskrunner.channels.imessage:register_plugin"
bluebubbles = "taskrunner.channels.bluebubbles:register_plugin"
whatsapp = "taskrunner.channels.whatsapp:register_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/taskrunner", "src/guardian", "src/bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=taskrunner --cov=guardian --cov=bridge --cov-report=term-missing"

[tool.coverage.run]
source = ["taskrunner", "guardian", "bridge"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
