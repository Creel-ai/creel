[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-taskrunner"
version = "0.1.0"
description = "Secure, scheduled LLM task runner with isolated fetchers"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "apscheduler>=3.10.0,<4.0.0",
    "pyyaml>=6.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyrage>=1.2.0",
    "textual>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]
guardian = [
    "transformers>=4.36.0",
    "onnxruntime>=1.16.0",
    "optimum[onnxruntime]>=1.14.0",
]

[project.scripts]
taskrunner = "runner:main"

[tool.setuptools.packages.find]
include = ["taskrunner*", "fetchers*", "guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
