[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creel"
version = "0.1.0"
description = "Secure, scheduled LLM task runner with isolated fetchers"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "apscheduler>=3.10.0,<4.0.0",
    "pyyaml>=6.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "certifi>=2024.0.0",
    "truststore>=0.10.0",  # Use OS cert store (fixes uv-managed Python SSL)
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyrage>=1.2.0",
    "textual>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=7.0",
    "playwright>=1.40.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12.20240311",
    "types-requests>=2.31.0",
    "Pillow>=10.0.0",
    "pytest-timeout>=2.3.0",
]
guardian = [
    "transformers>=4.36.0",
    "onnxruntime>=1.16.0",
    "optimum[onnxruntime]>=1.14.0",
]
whatsapp = [
    "neonize>=0.3.9",
]
encryption = [
    "cryptography>=41.0",
]
browser = [
    "playwright>=1.40.0",
]
vision = [
    "Pillow>=10.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
creel = "creel.cli:main"

[project.entry-points."creel.channels"]
imessage = "creel.channels.imessage:register_plugin"
bluebubbles = "creel.channels.bluebubbles:register_plugin"
whatsapp = "creel.channels.whatsapp:register_plugin"
telegram = "creel.channels.telegram:register_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/creel", "src/guardian", "src/bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=creel --cov=guardian --cov=bridge --cov=executors --cov-report=term-missing -m 'not smoke' --timeout=30"
markers = [
    "smoke: end-to-end tests requiring Docker and network access",
]

[tool.coverage.run]
source = ["creel", "guardian", "bridge", "executors"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 72

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = [
    "E501",   # line too long — handled by formatter
    "S101",   # assert — used extensively in tests
    "S603",   # subprocess-without-shell-check — executors need subprocess
    "S607",   # start-process-with-partial-path — executors call known CLIs
    "S108",   # hardcoded-temp-file — false positives on /tmp in test fixtures
    "S105",   # hardcoded-password-string — false positives on test data
    "S106",   # hardcoded-password-func-arg — false positives on test data
    "S110",   # try-except-pass — intentional in resilient daemon code
    "S112",   # try-except-continue — intentional in resilient daemon code
    "B008",   # function-call-in-default-argument — FastAPI Depends/Query pattern
    "B017",   # assert-raises-exception — acceptable in tests for Pydantic errors
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False — used in test error-path checks

[tool.mypy]
python_version = "3.11"
files = ["src/creel", "src/guardian", "src/bridge", "src/executors"]
mypy_path = "src"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
show_error_codes = true

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12.20240311",
]
