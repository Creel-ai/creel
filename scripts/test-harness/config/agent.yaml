# Test agent configuration for integration test harness.
# Points at the mock LLM server — no real API keys needed.
# ANTHROPIC_BASE_URL env var redirects the anthropic SDK to the mock server.

system_prompt: |
  You are a test agent for the Creel integration test harness.
  Respond helpfully and use tools when requested.

tools:
  exec:
    executor: host
    description: "Run shell commands"
    parameters:
      command:
        type: string
        description: "The shell command to execute"
        required: true

llm:
  model: claude-sonnet-4-20250514
  max_tokens: 1024
  # No secrets — ANTHROPIC_API_KEY is set via env var to a fake key

agent:
  max_turns: 10

session:
  sessions_dir: sessions
  max_history: 50
  summarize_on_trim: false
  ttl_hours: 0

workspace:
  path: workspace
  timezone: UTC

channels:
  telegram:
    bot_token: "000000000:FAKE-TOKEN-FOR-TESTING"
    mode: webhook
    webhook_path: /webhooks/telegram
    webhook_secret: "test-webhook-secret"
    allowed_senders:
      - "test-user-123"
    send_typing: false

guardian:
  enabled: true
  fast_classifier:
    enabled: false  # No ONNX model in test env
  llm_judge:
    enabled: false  # No real LLM for judge in tests
  policy:
    enabled: true
    policy_file: policies/test-policy.yaml
  audit:
    enabled: true
    log_file: guardian_audit.jsonl
  coherence:
    enabled: false
  drift:
    enabled: false
