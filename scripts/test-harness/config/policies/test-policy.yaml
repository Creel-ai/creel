# Test Guardian policy for integration test harness.
# Mirrors key rules from policies/default.yaml with a focus on
# blocking dangerous commands while allowing safe exec usage.

allow:
  - exec

deny:
  - delete_*

# Block dangerous shell patterns in exec commands
deny_when:
  # Destructive filesystem commands
  - tool: exec
    arg: command
    pattern: "*rm -rf*"
  - tool: exec
    arg: command
    pattern: "*rm -fr*"
  - tool: exec
    arg: command
    pattern: "*mkfs*"
  # Reverse shell / exfiltration patterns
  - tool: exec
    arg: command
    pattern: "*>/dev/tcp/*"
  - tool: exec
    arg: command
    pattern: "*bash -i*"
  - tool: exec
    arg: command
    pattern: "*nc -e*"
  # Pipe to shell (command injection via download)
  - tool: exec
    arg: command
    pattern: "*| bash*"
  - tool: exec
    arg: command
    pattern: "*|bash*"
  - tool: exec
    arg: command
    pattern: "*curl*|*sh*"
  - tool: exec
    arg: command
    pattern: "*wget*|*sh*"
  # Command substitution in curl/wget payloads
  - tool: exec
    arg: command
    pattern: "*$(curl*"
  - tool: exec
    arg: command
    pattern: "*$(wget*"
  # Fork bomb
  - tool: exec
    arg: command
    pattern: "*:(){ :|:& };:*"
  # Crontab modification
  - tool: exec
    arg: command
    pattern: "*crontab*"
  # chmod 777 (overly permissive)
  - tool: exec
    arg: command
    pattern: "*chmod 777*"

# Flag risky but potentially legitimate commands for review
review_when:
  - tool: exec
    arg: command
    pattern: "*sudo*"
  - tool: exec
    arg: command
    pattern: "*git push --force*"
