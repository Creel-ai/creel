name: morning_briefing
schedule: "0 7 * * *"  # 7am daily

fetch:
  calendar:
    image: fetcher-gcal:latest
    secrets: secrets/gcal.env.enc
    args:
      range: today

  weather:
    image: fetcher-weather:latest
    args:
      location: denver

  gmail_readonly:
    image: fetcher-gmail-readonly:latest
    secrets: secrets/gmail.env.enc
    args:
      query: "is:unread newer_than:1d"
      max_results: "10"
      full_body: "false"

prompt: |
  You're my personal assistant. Give me a quick rundown of my day.

  Today: {date}
  Weather: {weather}
  Calendar: {calendar}
  Recent emails: {gmail_readonly}

  Keep it under 200 words. Flag any early meetings, conflicts, or urgent emails.

output:
  type: imessage
  to: "+1XXXXXXXXXX"

llm:
  model: claude-sonnet-4-20250514
  max_tokens: 300
  secrets: secrets/anthropic.env.enc
